name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  BIN_NAME: bvr
jobs:
  # Every published artifact must be gated on the same checks CI runs. This
  # workflow used to build straight from the tag and upload, so a tag pushed
  # on a red tree shipped five binaries with nothing between the tests and
  # the release. `build` and `release` both depend on this job.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Differential gate
        run: cargo test -p bv --test golden_comparison -- --nocapture

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            method: native
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            method: native
            suffix: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            method: native
            suffix: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.method == 'cross'
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.method }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }} -p bv
          else
            cargo build --release --target ${{ matrix.target }} -p bv
          fi
        shell: bash
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="${BIN_NAME}-${VERSION}-${{ matrix.suffix }}.tar.gz"
          mkdir -p staging
          if [ -f "target/${{ matrix.target }}/release/${BIN_NAME}" ]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" staging/
          fi
          tar -czf "$ARCHIVE" -C staging .
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
        shell: bash
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $archive = "$($env:BIN_NAME)-$version-$($env:RUNNER_TARGET).zip"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          $bin = "target/${{ matrix.target }}/release/$($env:BIN_NAME).exe"
          if (Test-Path $bin) { Copy-Item $bin staging/ }
          Compress-Archive -Path staging/* -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii
          "ARCHIVE=$archive" | Out-File $env:GITHUB_ENV -Append
        env:
          RUNNER_TARGET: ${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            *.tar.gz
            *.zip
            *.sha256

  release:
    name: Attach artifacts to GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
