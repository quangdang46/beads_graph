name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # All three OSes report even when one fails. The default fail-fast
      # cancelled macOS and Windows as soon as ubuntu went red, which hid
      # platform-specific failures behind whichever OS happened to run
      # first — a bug that only reproduces on Windows (where `bd` installs
      # as a shim with no .exe) looks identical to a Linux-only failure
      # when the other two jobs are never given the chance to run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Full history is required: `cargo test --workspace` includes
      # crates/bv/tests/golden_comparison.rs, which shells out to `git log`
      # (directly, and via bv-correlation) for --robot-history and other
      # git-derived robot commands. A shallow checkout (the actions/checkout
      # default, fetch-depth: 1) starves those commands of history and makes
      # their output diverge from the frozen goldens, blowing the parity
      # ratchet even though nothing regressed. See the `differential` job
      # below, which hit the same issue first.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Differential gate: goldens are frozen from Go bv @ 18afafa (v0.25.0); the Rust
  # binary is run against every fixture/command pair and compared after
  # normalizing nondeterministic fields. Content parity is a RATCHET
  # (GOLDEN_GATE_BASELINE_FAILS in the test): regressions fail CI, parity
  # improvements require lowering the baseline. The job also fails loudly
  # if the golden corpus goes missing.
  differential:
    name: Golden corpus integrity
    runs-on: ubuntu-latest
    steps:
      # Full history is required: the selfrepo golden case runs
      # `bvr --robot-diff --diff-since HEAD~5` in the repo root, which
      # needs git history present. A shallow checkout (fetch-depth: 1)
      # resolves HEAD~5 to nothing and fails the golden gate with
      # FAIL(rust-error) in CI while passing locally with full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify golden corpus present and non-empty
        run: |
          count=$(find golden -type f | wc -l)
          echo "golden files: $count"
          [ "$count" -ge 70 ] || { echo "::error::Golden corpus missing/thin ($count < 70)"; exit 1; }
          # The corpus was re-captured against Go v0.25.0 (18afafa); the
          # previous 9ace029 was the v0.20.0 pin and no longer matches what
          # METADATA.txt records, so this grep failed on every run and the
          # whole differential job was permanently red. `expected_commit` in
          # METADATA.txt is written by capture_goldens.sh and read by nothing.
          grep -q "go_commit: 18afafa" golden/METADATA.txt
      - name: Golden byte-comparison gate (ratchet)
        run: cargo test -p bv --test golden_comparison -- --nocapture
