[package]
name = "bv-export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bv-core = { path = "../bv-core" }
bv-analysis = { path = "../bv-analysis" }
bv-correlation = { path = "../bv-correlation" }
png = "0.18"
jiff = { workspace = true }
# bundled: libsqlite3-sys 0.30.1 compiles SQLite with -DSQLITE_ENABLE_FTS5 and
# -DSQLITE_ENABLE_STAT4, which the exported `issues_fts` table and the
# `sqlite_stat4` table both need. Same version bv-core already pins, so the
# workspace shares one build.
rusqlite = { version = "0.32", features = ["bundled"] }
tiny-http = { version = "0.12", package = "tiny_http" }
thiserror = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde = { workspace = true }
serde_yaml_ng = "0.10"
sha2 = { workspace = true }
# The wizard's non-TTY guard needs the raw stdin file mode (`fstat` on fd 0) to
# tell a pipe from /dev/null, and a bounded read to tell a silent-but-open pipe
# from a closed one. AGENTS.md bans tokio and prescribes std threads plus
# crossbeam-channel as the mirror of Go's goroutine + `select`, which is exactly
# Go's `readWizardInputBlocking` shape (wizard.go:172-191).
libc = "0.2"
crossbeam-channel = { workspace = true }
