[package]
name = "bv"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "bvr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["string"] }
bv-core = { path = "../bv-core" }
bv-analysis = { path = "../bv-analysis" }
bv-robot = { path = "../bv-robot" }
serde_json = { workspace = true }
thiserror = { workspace = true }
jiff = { workspace = true }
bv-correlation = { path = "../bv-correlation" }
bv-graph-core = { path = "../bv-graph-core" }
bv-export = { path = "../bv-export" }
bv-tui = { path = "../bv-tui" }
bv-search = { path = "../bv-search" }
bv-update = { path = "../bv-update" }
# `--recipe` is resolved and rejected when the name is unknown, which is
# `pkg/recipe.Loader.Resolve` and its `UnknownRecipeError`.
bv-recipe = { path = "../bv-recipe" }
# `--id-pattern` hands each value to regex::Regex::compile before registering
# it with bv-correlation (Go main.go:1772-1782), so the CLI needs the type.
regex = "1"
# `--robot-history-timeout-ms` bounds the git-history prologue of robot triage
# with the same shape Go uses: the report is built on its own thread and the
# caller selects the result against a deadline. A channel plus `recv_timeout`
# is the sync stand-in for Go's `select` on `resCh` vs `histCtx.Done()`, and is
# this repo's established per-metric timeout pattern (no tokio, per AGENTS.md).
crossbeam-channel = { workspace = true }
# `--watch-export` (Go main.go:3315-3317) does `signal.Notify(sigCh,
# os.Interrupt, syscall.SIGTERM)` so Ctrl+C prints "Stopping watch mode..." and
# exits 0 instead of dying on the default disposition. Reproducing that needs a
# real signal handler, which std has no API for; libc is already in the lock
# file via other workspace members, so this adds no new package. It also backs
# the `fstat` probe in the Pages wizard, whose `st_mode` width differs per
# platform.
libc = "0.2"
# `--cpu-profile` (Go main.go:1908-1933) samples the process and writes the
# pprof protobuf, the same artifact Go's `runtime/pprof` produces. Rust has no
# stdlib equivalent, so the sampling comes from tikv/pprof-rs; `protobuf-codec`
# is the feature that turns its `Report` into a `protos::Profile` to encode.
# The protobuf-codegen half is a pure-Rust `.proto` parser, so this needs no
# `protoc` on the build machine (the prost-codec alternative would).
#
# **Unix only, and that is a parity gap on Windows.** pprof-rs 0.15 reaches for
# `nix::errno`, `nix::unistd`, `libc::pthread_t`, `libc::siginfo_t` and
# `libc::ucontext_t`, none of which exist for `x86_64-pc-windows-msvc`, so an
# unconditional dependency does not merely lack the feature there — the crate
# fails to compile:
#
#     error[E0432]: unresolved imports `nix::errno`, `nix::unistd`
#     error[E0425]: cannot find type `pthread_t` in crate `libc`
#
# Go's `runtime/pprof.StartCPUProfile` does work on Windows, so `--cpu-profile`
# is a real divergence there, not a bug in this port. The alternative is not
# building the whole binary for Windows at all, so the flag is gated and
# `start_cpu_profile` reports the limitation instead of failing the build.
# Lifting it needs a Windows-capable sampling profiler, not a cfg.
# `flate2` is here too because only `CpuProfileGuard::drop` gzips anything, and
# that struct is `#[cfg(unix)]`.
#
# This table MUST come after every shared `[dependencies]` entry. A TOML table
# header ends the one before it, so inserting this mid-list silently reassigns
# everything below it to the unix-only set — which builds fine on a mac and
# fails on Windows with `unresolved import crossbeam_channel` for a crate that
# is plainly declared two lines above.
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15.0", features = ["protobuf-codec"] }
flate2 = "1"

[dev-dependencies]
# The watch-loop test has to deliver a real SIGINT to check the graceful
# shutdown path; `Child::kill` sends SIGKILL, which skips the handler entirely.
libc = "0.2"
