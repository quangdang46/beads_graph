[workspace]
resolver = "2"
members = [
    "crates/bv-core",
    "crates/bv-analysis",
    "crates/bv-correlation",
    "crates/bv-search",
    "crates/bv-export",
    "crates/bv-robot",
    "crates/bv-tui",
    "crates/bv-graph-core",
    "crates/bv-update",
    "crates/bv-recipe",
    "crates/bv",
]
exclude = [
    "fuzz",
    # Verbatim upstream copy — self-contained wasm crate with its own lockfile.
    # Becomes part of the workspace in Phase 9 (bv-graph-core extraction).
    "crates/bv-graph-wasm",
]

[workspace.package]
version = "0.25.2"
edition = "2021"
license = "MIT"
authors = ["Tran Quang Dang <tranquangdang21@gmail.com>"]
repository = "https://github.com/quangdang46/beads_graph"
homepage = "https://github.com/quangdang46/beads_graph"
readme = "README.md"
description = "Compatible Rust successor of beads_viewer (Go) — port of v0.25.0"

# Nothing is published to crates.io: the path dependencies between the crates
# resolve locally, and cargo would reject them for a published `bv`.
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
jiff = { version = "=0.2", features = ["serde"] }
rayon = "1.10"
crossbeam-channel = "0.5"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
